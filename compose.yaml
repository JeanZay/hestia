name: hestia-local
services:
  # Optional disposable local database. Automated QA uses its own labelled driver.
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: hestia_test_local
      POSTGRES_USER: hestia_test
      POSTGRES_PASSWORD: ${HESTIA_LOCAL_DB_PASSWORD:?Provide an ephemeral local password}
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "-U", "hestia_test", "-d", "hestia_test_local"]
      interval: 5s
      timeout: 5s
      retries: 5
