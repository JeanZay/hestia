name: Besoin ou évolution
description: Capturer un besoin large ; le refinement et les US viendront au moment de l'engager.
title: "[Besoin] "
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin en langage naturel
      description: Qui veut faire quoi, dans quelle situation ? Utiliser des exemples synthétiques.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Résultat recherché et questions connues
      description: Exprimer l'effet utile attendu ; des critères détaillés ne sont pas exigés pour un besoin futur. Les agents mèneront le refinement avant développement.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Périmètre, dépendances et limites
      description: Hors périmètre, issues requises, données utilisées, environnement et autorisations éventuelles.
  - type: checkboxes
    id: data
    attributes:
      label: Confidentialité
      options:
        - label: Cette issue ne contient ni secret ni document ou donnée familiale réelle.
          required: true
